  <title id="title" data-part="title">Финни — векторный персонаж</title>
  <desc id="desc" data-part="desc">Фиолетовый лисёнок с зелёным хохолком, большими ушами и поднятой лапой. Векторный персонаж с раздельными слоями лица, лап, ушей и хвоста для диалоговой анимации.</desc>
